async function loadPipelines(){
  setSrc("emod","wait","loading");
  try{
    const u="https://ows.emodnet-humanactivities.eu/wfs?service=WFS&version=1.1.0&request=GetFeature&typeName=emodnet:pipelines&outputFormat=application/json&srsName=EPSG:4326&maxFeatures=3000&bbox=21,58.5,30.5,60.8,EPSG:4326";
    const j=await (await fetch(u)).json();let n=0;
    for(const ft of j.features){
      const nm=(ft.properties.name||"");if(!/balticconnector|nord stream/i.test(nm))continue;
      const parts=ft.geometry.type==="MultiLineString"?ft.geometry.coordinates:[ft.geometry.coordinates];
      parts.forEach((part,i)=>{
        let pts=part.map(c=>[c[1],c[0]]).filter(p=>p[0]>=58.8&&p[1]>=20.5);if(pts.length<2)return;
        const step=Math.max(1,Math.floor(pts.length/250));pts=pts.filter((_,k)=>k%step===0||k===pts.length-1);
        const title=/baltic/i.test(nm)?"Balticconnector (gas)":nm.replace(/\b(\w)(\w*)/g,(m,a,b)=>a+b.toLowerCase())+" (gas pipeline)";
        if(/baltic/i.test(nm)){const k=INFRA.findIndex(x=>x.id==="bc");if(k>=0)INFRA.splice(k,1)}
        INFRA.push({id:"emod_"+nm.replace(/\W+/g,"").toLowerCase()+"_"+i,name:title,kind:"gas",src:"EMODnet",pts,watch:/baltic/i.test(nm)});n++;
      });
    }
    setSrc("emod","ok",plural(n,"pipeline route"));drawInfra();
  }catch(e){setSrc("emod","err","unavailable — approximate Balticconnector in use")}
}

const metaQueue=new Set();
async function fetchMeta(mmsi){

  try{const r=await fetch("https://meri.digitraffic.fi/api/ais/v1/vessels/"+mmsi);if(r.ok){S.meta.set(mmsi,await r.json());render()}else S.meta.set(mmsi,{})}catch(e){}
  metaQueue.delete(mmsi);

async function poll(){

  }catch(e){setSrc("ais","err","fetch failed: "+e.message);if(!S.case){$("#live").className="nd bad";$("#live").innerHTML="<i></i>Baltic Sea — AIS feed unreachable"}}

function ingest(gj,now){
  S.feedTime=gj.dataUpdatedTime?Date.parse(gj.dataUpdatedTime):now;
  for(const f of gj.features||[]){
    const p=f.properties,c=f.geometry.coordinates,ts=p.timestampExternal;if(now-ts>CFG.gapMaxH*36e5)continue;
    let v=S.v.get(p.mmsi);if(!v){v={mmsi:p.mmsi,track:[]};S.v.set(p.mmsi,v)}
    if(v.ts===ts)continue;
    Object.assign(v,{lat:c[1],lon:c[0],sog:p.sog,cog:p.cog,hdg:p.heading===511?null:p.heading,nav:p.navStat,ts});
    v.track.push({t:ts,lat:c[1],lon:c[0],sog:p.sog,cog:p.cog,hdg:v.hdg});
    while(v.track.length&&now-v.track[0].t>6*36e5)v.track.shift();
  }
  for(const [k,v] of S.v)if(now-v.ts>CFG.gapMaxH*36e5)S.v.delete(k);
  analyse(now);persistTracks(now);render();
}

const SANC={byImo:new Map(),byMmsi:new Map(),n:0,ready:false};
const DSN={eu_journal_sanctions:"EU",eu_sanctions_map:"EU",eu_fsf:"EU",gb_fcdo_sanctions:"UK",gb_hmt_sanctions:"UK",us_ofac_sdn:"US (OFAC)",us_ofac_cons:"US (OFAC)",us_trade_csl:"US (trade list)",ca_dfatd_sema_sanctions:"Canada",ch_seco_sanctions:"Switzerland",
 ua_war_sanctions:"Ukraine (War & Sanctions)",ua_nsdc_sanctions:"Ukraine (NSDC)",au_dfat_sanctions:"Australia",nz_russia_sanctions:"New Zealand",un_sc_sanctions:"UN Security Council",jp_mof_sanctions:"Japan",
 tokyo_mou_detention:"Tokyo MoU detention",ext_tokyo_mou_psc:"Tokyo MoU detention",black_sea_mou_detention:"Black Sea MoU detention",abuja_mou_detention:"Abuja MoU detention",ext_abuja_mou_psc:"Abuja MoU detention",paris_mou_banned:"Paris MoU banned list"};
function parseCSV(t){const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}else if(c!=="\r")f+=c}
  if(f||row.length){row.push(f);rows.push(row)}return rows}
async function loadSanctions(){
  setSrc("sanc","wait","loading list");
  try{
    const rows=parseCSV(await (await fetch("https://data.opensanctions.org/datasets/latest/maritime/maritime.csv")).text()),ix=Object.fromEntries(rows[0].map((h,i)=>[h,i]));
    for(const r of rows.slice(1)){if(r[ix.type]!=="VESSEL")continue;SANC.n++;const o={name:r[ix.caption],risk:r[ix.risk].split(";").filter(Boolean),url:r[ix.url],ds:r[ix.datasets].split(";").filter(Boolean)};
      const imo=(r[ix.imo].match(/\d{7}/)||[])[0];if(imo){const a=SANC.byImo.get(imo)||[];a.push(o);SANC.byImo.set(imo,a)}
      for(const m of r[ix.mmsi].split(";"))if(/^\d{9}$/.test(m)){const a=SANC.byMmsi.get(m)||[];a.push(o);SANC.byMmsi.set(m,a)}}
    SANC.ready=true;analyse(Date.now());render();
  }catch(e){setSrc("sanc","err","unavailable")}
}
function sancOf(v){ // level 2 = sanctioned, 1 = listed (shadow fleet / of interest), 0 = detention record only
  if(!SANC.ready)return null;const m=S.meta.get(v.mmsi)||{},a=(m.imo&&SANC.byImo.get(String(m.imo)))||SANC.byMmsi.get(String(v.mmsi));if(!a)return null;
  const tags=new Set(a.flatMap(x=>x.risk)),ds=[...new Set(a.flatMap(x=>x.ds))],prog=[...new Set(ds.map(d=>DSN[d]||d.replace(/_/g," ")))];
  const sanctionProg=[...new Set(ds.filter(d=>/sanction|ofac|trade_csl/.test(d)&&!/ua_war/.test(d)).map(d=>DSN[d]||d.replace(/_/g," ")))];
  return {level:tags.has("sanction")?2:(tags.has("mare.shadow")||tags.has("poi"))?1:0,tags:[...tags],prog,sanctionProg,shadow:tags.has("mare.shadow"),detained:tags.has("mare.detained"),
    listedAs:[...new Set(a.map(x=>x.name))],url:a[0].url,rename:!!m.name&&!a.some(x=>x.name.replace(/\s+/g," ").trim().toUpperCase()===m.name.replace(/\s+/g," ").trim().toUpperCase())};
}
const sancLabel=sc=>sc.level===2?"Sanctioned":sc.shadow?"Shadow-fleet listed (not sanctioned)":sc.level===1?"Listed as of interest (not sanctioned)":"Detention record";

/* ================= DETECTORS + EXPLAINABLE SCORE ================= */
function nearest(v){
  let best=null;
  for(const f of INFRA){if(f.watch===false)continue;const d=distToLine([v.lat,v.lon],f.pts);if(!best||d.km/f.buf<best.rel)best={f,km:d.km,rel:d.km/f.buf}}
  if(!best)return null;const a=best.f.pts[0],b=best.f.pts[best.f.pts.length-1];
  best.landKm=Math.min(hav([v.lat,v.lon],a),hav([v.lat,v.lon],b));best.inside=best.km<=best.f.buf;return best;
}
function analyse(now){
  const live=new Set();let inCorr=0;
  for(const v of S.v.values()){
    const m=S.meta.get(v.mmsi)||{};v.cls=vclass(m.shipType);v.name=(m.name||("MMSI "+v.mmsi)).trim();v.sanc=sancOf(v);
    const nr=nearest(v);v.near=nr;v.factors=[];v.kind=null;v.score=0;if(!nr)continue;
    const age=(now-v.ts)/60000,fresh=age<=CFG.freshMin;
    v.inCorr=nr.inside&&nr.landKm>CFG.landfallKm&&v.nav!==5;
    if(v.inCorr&&fresh)inCorr++;
    if(!v.inCorr)continue;
    if(!S.meta.has(v.mmsi))fetchMeta(v.mmsi);
    if(SERVICE.has(v.cls))continue;
    const F=v.factors,tr=v.track,inside=tr.filter(p=>distToLine([p.lat,p.lon],nr.f.pts).km<=nr.f.buf);
    const dwell=inside.length?(v.ts-inside[0].t)/60000:0,recentFast=tr.some(p=>v.ts-p.t<=60*60000&&p.sog>=CFG.fastKn);
    const crab=v.hdg!=null&&v.sog>=CFG.slowKn[0]?angDiff(v.cog,v.hdg):0;
    if(fresh){
      if(v.nav===1||v.sog<CFG.slowKn[0]){v.kind="stationary";
        F.push([v.nav===1?"Reports “at anchor” inside the corridor":"Stationary inside the corridor (not moored)",30]);
        if(dwell>=CFG.dwellMin)F.push([`Has stayed inside for ${Math.round(dwell)} min`,10]);
      }else if(v.sog<=CFG.slowKn[1]){v.kind="slow";
        if(recentFast&&crab>=CFG.crabDeg)F.push([`Anchor-drag signature: speed fell from ≥${CFG.fastKn} kn to ${v.sog.toFixed(1)} kn and course differs from heading by ${Math.round(crab)}°`,40]);
        else if(recentFast)F.push([`Speed fell from ≥${CFG.fastKn} kn to ${v.sog.toFixed(1)} kn inside the corridor`,25]);
        else if(crab>=CFG.crabDeg)F.push([`Moving ${v.sog.toFixed(1)} kn with course ${Math.round(crab)}° off heading (possible drag or drift)`,20]);
        else F.push([`Slow transit at ${v.sog.toFixed(1)} kn inside the corridor`,10]);
        if(dwell>=CFG.dwellMin)F.push([`Has stayed inside for ${Math.round(dwell)} min`,10]);
      }
    }else if(age>=CFG.gapMin&&v.sog>=3&&now-S.feedTime<5*60000&&hav([v.lat,v.lon],CFG.center)<CFG.radiusKm-40){
      v.kind="gap";F.push([`AIS silent for ${Math.round(age)} min; last report was under way at ${v.sog.toFixed(1)} kn inside the corridor`,25]);
    }
    if(!v.kind)continue;
    if(v.cls==="tanker")F.push(["Vessel type: tanker",10]);else if(v.cls==="cargo")F.push(["Vessel type: cargo",5]);
    if(S.watch.has(String(v.mmsi))||(m.imo&&S.watch.has(String(m.imo))))F.push(["On your watchlist",15]);
    if(v.sanc&&v.sanc.level===2)F.push([`Sanctioned vessel (${v.sanc.sanctionProg.slice(0,4).join(", ")||"listed"}), per OpenSanctions`,20]);
    else if(v.sanc&&v.sanc.level===1)F.push([v.sanc.shadow?"Listed as shadow-fleet vessel, per OpenSanctions":"Listed as vessel of interest, per OpenSanctions",12]);
    if(nr.f.src==="approx")F.push(["Cable route is approximate, so position relative to the cable is uncertain",-5]);
    if(S.wx&&S.wx.wind>=CFG.windStrong&&v.kind!=="gap")F.push([`Strong wind (${S.wx.wind.toFixed(0)} m/s): slow speed or anchoring may be weather-related`,-10]);
    v.score=Math.max(0,Math.min(100,F.reduce((a,x)=>a+x[1],0)));
    if(v.score>=20){const key=v.mmsi+":"+v.kind;live.add(key);const a=S.alerts.get(key)||{key,mmsi:v.mmsi,kind:v.kind,first:now};
      Object.assign(a,{last:now,score:v.score,active:true,infra:nr.f.name,name:v.name,factors:F.slice(),cls:v.cls});S.alerts.set(key,a)}
  }
  for(const [k,a] of S.alerts){if(!live.has(k))a.active=false;if(now-a.last>2*36e5)S.alerts.delete(k)}
  S.inCorr=inCorr;
  if(SANC.ready){const fr=[...S.v.values()].filter(v=>now-v.ts<=CFG.freshMin*60000);S.nSanc=fr.filter(v=>v.sanc&&v.sanc.level===2).length;S.nListed=fr.filter(v=>v.sanc&&v.sanc.level===1).length;
    S.src.sanc={state:"ok",txt:`${SANC.n.toLocaleString("en")} vessels listed · ${S.nSanc} sanctioned and ${S.nListed} listed in area`}}
}
const KIND={stationary:"Stationary over infrastructure",slow:"Slow movement over infrastructure",gap:"AIS gap in corridor"};
const TITLE=k=>KIND[k].replace(/\b[a-z]/g,c=>c.toUpperCase()).replace(/ In /g," in ").replace("Ais","AIS");
const KSHORT={stationary:"Stationary over",slow:"Slow movement over",gap:"AIS gap near"};
const lvCol=s=>s>=50?"var(--crit)":s>=30?"var(--warn)":"var(--cyan)";

/* ---- recorded tracks: replay + radar matching survive a reload ---- */
let lastPersist=0;
function readStore(){try{return JSON.parse(localStorage.getItem("marint_tracks")||"{}")}catch(e){return {}}}
function persistTracks(now){
  if(now-lastPersist<120000)return;lastPersist=now;
  try{const old=readStore(),out={},cut=Math.round((now-30*36e5)/60000);
    for(const v of S.v.values()){const arr=(old[v.mmsi]||[]).filter(p=>p[0]>=cut),last=arr[arr.length-1],tm=Math.round(v.ts/60000);
      if(!last||(tm-last[0]>=2&&(Math.abs(last[1]-v.lat)>0.001||Math.abs(last[2]-v.lon)>0.002||tm-last[0]>=20)))arr.push([tm,+v.lat.toFixed(4),+v.lon.toFixed(4)]);
      if(arr.length)out[v.mmsi]=arr}
    for(const k in old)if(!out[k]){const arr=old[k].filter(p=>p[0]>=cut);if(arr.length)out[k]=arr}
    localStorage.setItem("marint_tracks",JSON.stringify(out));
  }catch(e){}
}
function mergeTrack(st,tr){const a=(st||[]).slice();const last=a.length?a[a.length-1][0]:-1;for(const p of tr){const m=p.t/60000;if(m>last)a.push([m,p.lat,p.lon])}return a}
function historyStart(){let t=Date.now();const st=readStore();for(const k in st)if(st[k].length)t=Math.min(t,st[k][0][0]*60000);for(const v of S.v.values())if(v.track.length)t=Math.min(t,v.track[0].t);return Math.max(t,Date.now()-30*36e5)}
function aisAt(t){
  const store=S.case?S.case.tracks:readStore(),tm=t/60000,res=[],seen=new Set();
  const add=(mmsi,arr)=>{let a=null,b=null;for(const p of arr){if(p[0]<=tm)a=p;else{b=p;break}}
    if(a&&b&&b[0]-a[0]<=25){const k=(tm-a[0])/(b[0]-a[0]);res.push({mmsi,lat:a[1]+k*(b[1]-a[1]),lon:a[2]+k*(b[2]-a[2]),rot:hav([a[1],a[2]],[b[1],b[2]])>0.05?bearing([a[1],a[2]],[b[1],b[2]]):null})}
    else if(a&&tm-a[0]<=10)res.push({mmsi,lat:a[1],lon:a[2],rot:null});else if(b&&b[0]-tm<=10)res.push({mmsi,lat:b[1],lon:b[2],rot:null})};
  if(!S.case)for(const v of S.v.values()){seen.add(String(v.mmsi));add(v.mmsi,mergeTrack(store[v.mmsi],v.track))}
  for(const k in store)if(!seen.has(k))add(+k,store[k]);
  return res;
}

/* ================= NASA SENTINEL-1 RADAR: ship detection in the browser ================= */
const tileXY=(lat,lon,z)=>{const n=2**z,yr=lat*R;return [(lon+180)/360*n,(1-Math.log(Math.tan(yr)+1/Math.cos(yr))/Math.PI)/2*n]};
const xyLL=(x,y,z)=>{const n=2**z;return [Math.atan(Math.sinh(Math.PI*(1-2*y/n)))/R,x/n*360-180]};
function tileData(layer,date,z,x,y){
  return new Promise(res=>{const i=new Image();i.crossOrigin="anonymous";
    i.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=256;const g=c.getContext("2d",{willReadFrequently:true});g.drawImage(i,0,0);res(g.getImageData(0,0,256,256))}catch(e){res(null)}};
    i.onerror=()=>res(null);i.src=`${GIBS}${layer}/default/${date}/GoogleMapsCompatible_Level12/${z}/${y}/${x}.png`;setTimeout(()=>res(null),20000)});
}
function detectTile(img,z,tx,ty){ // small bright blobs on dark water
  const d=img.data,N=256,lum=new Uint8Array(N*N),ok=new Uint8Array(N*N);let valid=0;const hist=new Uint32Array(256);
  for(let i=0;i<N*N;i++){const r=d[4*i],g=d[4*i+1],b=d[4*i+2],a=d[4*i+3];if(a===0||r+g+b<9)continue;ok[i]=1;valid++;const l=(r+g+b)/3|0;lum[i]=l;hist[l]++}
  if(valid<N*N*0.05)return {valid,targets:[]};
  let acc=0,med=0;for(let l=0;l<256;l++){acc+=hist[l];if(acc>=valid/2){med=l;break}}
  const T=Math.max(105,med+65),seen=new Uint8Array(N*N),out=[];
  for(let i=0;i<N*N;i++){
    if(seen[i]||lum[i]<T)continue;
    const st=[i],px=[];seen[i]=1;let x0=N,x1=0,y0=N,y1=0;
    while(st.length&&px.length<400){const k=st.pop();px.push(k);const x=k%N,y=k/N|0;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=N||yy>=N)continue;const q=yy*N+xx;if(!seen[q]&&lum[q]>=T){seen[q]=1;st.push(q)}}}
    if(px.length>30||x1-x0>10||y1-y0>10)continue;               // too big: land, not a ship
    if(x0<3||y0<3||x1>N-4||y1>N-4)continue;                      // touches tile edge: ambiguous
    let ring=0,bright=0,nod=0;
    for(let y=y0-6;y<=y1+6;y++)for(let x=x0-6;x<=x1+6;x++){if(x<0||y<0||x>=N||y>=N)continue;if(x>=x0-1&&x<=x1+1&&y>=y0-1&&y<=y1+1)continue;ring++;const q=y*N+x;if(!ok[q])nod++;else if(lum[q]>Math.max(80,med+40))bright++}
    if(nod/ring>0.2||bright/ring>0.05)continue;                  // swath edge or coastline clutter
    let sx=0,sy=0,sw=0,pk=0;for(const k of px){const w=lum[k];sx+=(k%N)*w;sy+=(k/N|0)*w;sw+=w;pk=Math.max(pk,w)}
    if(pk<Math.max(150,med+110))continue;                        // faint single pixels are speckle
    const cx=sx/sw+.5,cy=sy/sw+.5,ll=xyLL(tx+cx/N,ty+cy/N,z);
    out.push({lat:ll[0],lon:ll[1],px:px.length,peak:pk,bg:med,tx,ty,cx,cy,lenM:Math.round(Math.max(x1-x0+1,y1-y0+1)*156543*Math.cos(ll[0]*R)/2**z)});
  }
  return {valid,targets:out};
}
function dedupe(list){const out=[];for(const t of list.slice().sort((a,b)=>b.peak-a.peak))if(!out.some(o=>hav([o.lat,o.lon],[t.lat,t.lon])<0.3))out.push(t);return out}
async function mapLimit(items,n,fn){let i=0;await Promise.all(Array.from({length:n},async()=>{while(i<items.length){const k=i++;await fn(items[k],k)}}))}
async function sarCoverage(date){const [x,y]=tileXY(59.8,25,7).map(Math.floor);let best=0; // best-covered of three tiles across the gulf
  for(const t of [[x,y],[x-1,y],[x+1,y]]){const im=await tileData(SAR_LAYER,date,7,t[0],t[1]);if(!im)continue;let v=0,n=0;for(let i=3;i<im.data.length;i+=16){n++;if(im.data[i]>0&&im.data[i-1]+im.data[i-2]+im.data[i-3]>8)v++}best=Math.max(best,n?v/n:0)}
  return best}
let sarDatesP=null;
function sarDates(){return sarDatesP||(sarDatesP=(async()=>{const dates=[],pick=S.sar.pick,t0=pick?Date.parse(pick+"T12:00:00Z"):Date.now();
  for(let k=0;k<12&&dates.length<2;k++){const d=ymd(t0-k*864e5);const c=await sarCoverage(d);if(c>(pick&&k===0?0.05:0.5))dates.push({d,c});else if(pick&&k===0)break}
  if(dates.length){whenMap.then(()=>map.getSource("sar").setTiles(gibsTiles(SAR_LAYER,dates[0].d,"GoogleMapsCompatible_Level12","png")));S.sar.latest=dates[0].d;setSrc("sar","ok","latest image "+dates[0].d)}
  else setSrc("sar","err","no recent image");return dates})())}
async function sarScan(){
  const st=S.sar;st.status="Finding the latest radar image…";render();
  try{
    sarDatesP=null;const dates=await sarDates();
    if(!dates.length){st.status=st.pick?`NASA has no Sentinel-1 radar image of the Gulf of Finland for ${st.pick}. Pick another date.`:"No recent Sentinel-1 coverage found in NASA GIBS for this area.";st.fail=true;render();return}
    st.fail=false;
    const date=dates[0].d,ref=dates[1]?.d;st.date=date;st.ref=ref;
    const z=CFG.sarZoom,a=CFG.aoi,[xa,ya]=tileXY(a.n,a.w,z).map(Math.floor),[xb,yb]=tileXY(a.s,a.e,z).map(Math.floor),tiles=[];
    for(let x=xa;x<=xb;x++)for(let y=ya;y<=yb;y++)tiles.push([x,y]);
    let done=0;const total=tiles.length*(ref?2:1);
    const scan=async dt=>{const all=[],imgs=new Map();
      await mapLimit(tiles,8,async t=>{const im=await tileData(SAR_LAYER,dt,z,t[0],t[1]);done++;if(done%10===0){st.status=`Scanning radar tiles ${done}/${total}…`;render()}
        if(!im)return;const r=detectTile(im,z,t[0],t[1]);if(r.targets.length){all.push(...r.targets);if(dt===date)imgs.set(t.join(","),im)}});return {all:dedupe(all),imgs}};
    const cur=await scan(date),prev=ref?await scan(ref):{all:[]};
    let passes=[];
    try{const j=await (await fetch(`https://cmr.earthdata.nasa.gov/search/granules.json?short_name=OPERA_L2_RTC-S1_V1&bounding_box=${a.w},${a.s},${a.e},${a.n}&temporal=${date}T00:00:00Z,${date}T23:59:59Z&page_size=2000`)).json();
      passes=j.feed.entry.map(e=>({t:Date.parse(e.time_start),poly:String(e.polygons?.[0]?.[0]||"").split(" ").map(Number).filter(n=>!isNaN(n))}));setSrc("cmr","ok",plural(passes.length,"radar burst")+" on "+date)}catch(e){setSrc("cmr","err","times unavailable")}
    const inPoly=(lat,lon,p)=>{let c=false;for(let i=0,j=p.length-2;i<p.length-1;j=i,i+=2){const yi=p[i],xi=p[i+1],yj=p[j],xj=p[j+1];if((yi>lat)!==(yj>lat)&&lon<(xj-xi)*(lat-yi)/(yj-yi)+xi)c=!c}return c};
    const passTimes=[...new Set(passes.map(p=>Math.round(p.t/3e5)*3e5))].sort();st.passTimes=passTimes;
    const cache=new Map(),at=t=>{const k=Math.round(t/6e4);if(!cache.has(k))cache.set(k,aisAt(t));return cache.get(k)};
    let nStatic=0;const targets=[];
    for(const tg of cur.all){
      if(prev.all.some(p=>hav([tg.lat,tg.lon],[p.lat,p.lon])<CFG.sarStaticKm)){nStatic++;continue}
      let times=passes.filter(p=>p.poly.length>=6&&inPoly(tg.lat,tg.lon,p.poly)).map(p=>p.t);if(!times.length)times=passTimes;
      times=[...new Set(times.map(t=>Math.round(t/6e4)*6e4))];tg.times=times;tg.match=null;let covered=false;
      for(const t of times){const snap=at(t);if(snap.length>=15)covered=true;let best=null;
        for(const s of snap){const dkm=hav([tg.lat,tg.lon],[s.lat,s.lon]);if(dkm<=CFG.sarMatchKm&&(!best||dkm<best.km))best={mmsi:s.mmsi,km:dkm,t}}
        if(best){tg.match=best;break}}
      tg.status=tg.match?"matched":covered?"unmatched":"unknown";
      const nr=nearest(tg);tg.near=nr;tg.inCorr=!!(nr&&nr.inside&&nr.landKm>CFG.landfallKm);
      const im=cur.imgs.get(tg.tx+","+tg.ty);if(im)tg.chip=chip(im,tg.cx,tg.cy);targets.push(tg);
    }
    targets.sort((p,q)=>(q.inCorr-p.inCorr)||(q.peak-p.peak));
    st.targets=targets;st.nStatic=nStatic;st.status="done";setSrc("sar","ok",`${plural(targets.length,"target")} · image ${date}`);
    S.layers.sarT=true;applyLayers();render();
  }catch(e){st.status="Radar scan failed: "+e.message;setSrc("sar","err","scan failed");render()}
}
function chip(im,cx,cy){const c=document.createElement("canvas");c.width=c.height=33;const t=document.createElement("canvas");t.width=t.height=256;t.getContext("2d").putImageData(im,0,0);c.getContext("2d").drawImage(t,Math.round(cx)-16,Math.round(cy)-16,33,33,0,0,33,33);return c.toDataURL()}
const SCOL={matched:"#2fbf8e",unmatched:"#b754e0",unknown:"#8fa3b5"};
const STXT={matched:"matched to AIS",unmatched:"possible dark vessel",unknown:"not checkable"};

function freshVessels(){const now=Date.now();return [...S.v.values()].filter(v=>v.lat!=null&&now-v.ts<=CFG.freshMin*60000)}
function drawVessels(){
  if(!mapReady)return;let feats;

    feats=aisAt(S.replay).map(s=>{const nm=S.case?(S.case.vessels[s.mmsi]?.name||"MMSI "+s.mmsi):(S.v.get(s.mmsi)?.name||"MMSI "+s.mmsi),sc=hot.get(s.mmsi)||0;
      return {type:"Feature",geometry:{type:"Point",coordinates:[s.lon,s.lat]},properties:{mmsi:s.mmsi,name:nm,sog:0,score:sc,sanc:0,rot:s.rot??0,shape:s.rot==null?"dot":"arrow",lv:sc>=50?"crit":sc>=30?"watch":"normal"}}})}
  else{const now=Date.now();feats=[];for(const v of S.v.values()){if(v.lat==null)continue;const stale=now-v.ts>CFG.freshMin*60000;if(stale&&v.kind!=="gap")continue;
    const sl=v.sanc?v.sanc.level:0,lv=sl===2?"sanc":sl===1?"listed":v.kind==="gap"?"gap":v.score>=50?"crit":v.score>=30?"watch":SERVICE.has(v.cls)?"service":"normal";
    feats.push({type:"Feature",geometry:{type:"Point",coordinates:[v.lon,v.lat]},properties:{mmsi:v.mmsi,name:v.name+(sl===2?" · SANCTIONED":sl===1?" · listed, not sanctioned":""),sog:v.sog,score:v.score||0,sanc:sl,rot:v.hdg??v.cog??0,shape:v.sog>=0.5?"arrow":"dot",lv}})}}

const stamp=t=>new Date(t).toISOString().slice(0,16).replace("T"," ")+" UTC";
function buildCase(){
  const now=Date.now(),store=readStore(),tracks={},vessels={};
  for(const k in store)tracks[k]=store[k].slice();
  for(const v of S.v.values()){tracks[v.mmsi]=mergeTrack(tracks[v.mmsi],v.track).map(p=>[Math.round(p[0]*10)/10,+p[1].toFixed(4),+p[2].toFixed(4)])}
  let t0=now;for(const k in tracks){if(!tracks[k].length){delete tracks[k];continue}t0=Math.min(t0,tracks[k][0][0]*60000);
    const v=S.v.get(+k),m=S.meta.get(+k)||{};vessels[k]={name:v?.name||m.name||"MMSI "+k,cls:v?.cls||vclass(m.shipType),flag:flag(+k),imo:m.imo||null}}
  const sar=S.sar.status==="done"?{date:S.sar.date,ref:S.sar.ref,passTimes:S.sar.passTimes,nStatic:S.sar.nStatic,
    targets:S.sar.targets.map(t=>({lat:t.lat,lon:t.lon,lenM:t.lenM,peak:t.peak,bg:t.bg,status:t.status,times:t.times,match:t.match,chip:t.chip,matchName:t.match?(S.v.get(t.match.mmsi)?.name||null):null}))}:null;
  return {marintCase:1,name:"Gulf of Finland · "+stamp(t0)+" → "+stamp(now),savedAt:now,range:[t0,now],tracks,vessels,
    alerts:[...S.alerts.values()].map(a=>({mmsi:a.mmsi,name:a.name,cls:a.cls,kind:a.kind,score:a.score,infra:a.infra,first:a.first,last:a.last,factors:a.factors||[]})),
    sar,wx:S.wx,sources:"AIS: Fintraffic Digitraffic (CC BY 4.0). Radar: NASA GIBS OPERA RTC Sentinel-1, times from NASA CMR. Wind: Open-Meteo. Cable routes approximate."};
}

/* Reference incident: only facts reported by Finnish and Estonian authorities and the press. No AIS track of the
   vessel is included, because none is openly available; nothing here is reconstructed or simulated. */
const FITBURG={title:"Fitburg cable incident",sub:"Gulf of Finland · 31 December 2025 · documented case",
 facts:[["Vessel","Fitburg, 132 m general cargo ship, flag St Vincent & the Grenadines"],["Voyage","Left St Petersburg on 30 Dec 2025, bound for Haifa, carrying steel"],
  ["Fault detected","Elisa noticed a disturbance on its Helsinki–Tallinn data cable at about 04:53 local time (02:53 UTC)"],["Where","Damage in Estonia’s economic zone; the ship was then found in Finland’s"],
  ["Interception","Patrol vessel Turva and a helicopter found it under way with its anchor chain in the sea; reported confirmed 07:34 local"],
  ["Police finding","Anchor and chain believed dragged along the seabed for at least several tens of kilometres before the damage point"],["Outcome","Ship seized and taken to Kantvik, 14 crew detained; released 12 Jan 2026 while the investigation continued"]],
 src:[["Finnish Police statement","https://poliisi.fi/en/-/police-investigate-cable-damage-in-the-gulf-of-finland-in-cooperation-with-other-authorities"],["The Register, 2 Jan 2026","https://www.theregister.com/2026/01/02/finnish_cops_interviewing_fitburg_crew/"],
  ["gCaptain","https://gcaptain.com/baltic-shadow-games-finland-detains-cargo-ship-in-suspected-hybrid-attack/"],["The Moscow Times, police on anchor drag","https://www.themoscowtimes.com/2026/07/26/vessel-coming-from-russia-dragged-anchor-before-subsea-cable-damaged-finnish-police"]],
 pins:[["Reported damage area (approximate)",59.70,24.80,""],["Kantvik: ship taken here",60.08,24.38,"b"]]};
function openFitburg(){
  closeCard();const f=FITBURG;
  $("#card").innerHTML=`<div class="hd"><div><h2>${f.title}</h2><p>${f.sub}</p></div><button class="x" id="x" aria-label="Close">×</button></div><div class="bd">
   <div class="wn"><b>Why this case matters for MARINT.</b> The ship was broadcasting AIS and still dragged its anchor for tens of kilometres before the cable failed. AIS being switched on did not prevent it, so watching behaviour over cable corridors matters more than watching for “dark” ships. Whether this ship’s AIS showed the speed loss that MARINT’s detector looks for can only be checked against its recorded track.</div>
   <h3>What is on record</h3><div class="kv">${f.facts.map(x=>`<span>${x[0]}</span><span>${esc(x[1])}</span>`).join("")}</div>
   <h3>What this page can and cannot show</h3><div class="note">The map pins are approximate and the cable line is schematic. The ship’s AIS track for that night is not openly available, so it is <b>not</b> drawn or replayed here; nothing is reconstructed. NASA’s radar passes on 31 Dec 2025 (04:25 and 15:40 UTC) covered only the gulf east of about 26°E, so there is no radar image of the incident area for that date.</div>
   <h3>Sources</h3><ul class="c">${f.src.map(x=>`<li><a href="${x[1]}" target="_blank" rel="noopener" style="color:var(--cyan)">${esc(x[0])}</a></li>`).join("")}</ul></div>`;
  $("#card").classList.add("open");$("#x").onclick=closeCard;
  S.pins=f.pins.map(p=>{const d=document.createElement("div");d.className="pin "+p[3];d.textContent=p[0];return new maplibregl.Marker({element:d,anchor:"bottom"}).setLngLat([p[2],p[1]]).addTo(map)});
  map.fitBounds([[23.6,59.35],[25.6,60.25]],{padding:{top:80,bottom:100,left:160,right:400}});
}

/* ---- opening animation: the logo fills like liquid, settles, then the wordmark slides out (as on the original site) ---- */
(function(){
  const el=$("#boot");if(!el)return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){el.remove();return}
  const glow=el.querySelector(".glow"),front=$("#btfront"),bumps=[...el.querySelectorAll(".btb")],hl=$("#bthl"),map_=$("#btmap"),fluid=$("#btfluid"),crisp=$("#btcrisp"),word=el.querySelector(".word"),wspan=word.firstElementChild;
  const T={fadeIn:.3,f0:.3,f1:1.9,s1:2.45,hold:2.65,move:3.35,lock:3.85,end:4.4},Y0=560,Y1=10;
  const io=x=>-(Math.cos(Math.PI*x)-1)/2,out=x=>1-(1-x)*(1-x),inn=x=>x*x,p2=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
  const seg=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a))),lerp=(a,b,k)=>a+(b-a)*k;
  wspan.style.opacity=1;const W=wspan.getBoundingClientRect().width;wspan.style.opacity=0;
  const t0=performance.now();
  (function frame(now){
    const t=(now-t0)/1000;
    el.style.opacity=t<T.lock?out(seg(t,0,T.fadeIn)):1-p2(seg(t,T.lock,T.end));
    const f=io(seg(t,T.f0,T.f1)),y=lerp(Y0,Y1,f);front.setAttribute("y",y);
    bumps.forEach((b,i)=>b.setAttribute("cy",y-18+(+b.dataset.dy)*Math.sin(t*3+i*1.7)));
    hl.setAttribute("y",lerp(530,-22,f));
    const st=seg(t,T.f1,T.s1);hl.style.opacity=.9*(1-inn(st));map_.setAttribute("scale",(16*(1-out(st))).toFixed(2));
    glow.style.opacity=t<T.f1?.5*out(seg(t,T.f0,T.f1)):lerp(.5,.12,inn(st));glow.style.transform=`translate(-50%,-50%) scale(${lerp(.8,1,out(seg(t,T.f0,T.f1)))})`;
    const x=seg(t,T.s1-.22,T.s1);fluid.style.opacity=1-inn(x);crisp.style.opacity=out(x);
    const m=seg(t,T.hold,T.move);word.style.width=(W*p2(m)).toFixed(1)+"px";const mm=out(seg(t,T.hold+(T.move-T.hold)*.25,T.move));wspan.style.opacity=mm;wspan.style.filter=`blur(${(4*(1-mm)).toFixed(2)}px)`;
    if(t<T.end)requestAnimationFrame(frame);else el.remove();
  })(t0);
})();
